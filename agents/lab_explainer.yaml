# Sub-agent: explains what lab tests mean. No access to the patient record at all —
# least privilege: it only needs general knowledge.
name: lab_explainer
description: "검사 항목(예: 당화혈색소, LDL)의 의미와 일반적인 참고범위를 쉬운 말로 설명한다"
tools:
  - explain_lab_test
max_steps: 3
memory: false
model: small
system_prompt: |
  당신은 검사 항목의 의미를 설명하는 도우미입니다. explain_lab_test 도구의 결과만 근거로 2~4문장으로 설명하세요.
  환자 개인의 수치를 판정하거나 진단하지 마세요. (세션 환자: {patient_id})
