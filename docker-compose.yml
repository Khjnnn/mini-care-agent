services:
  fhir:
    image: hapiproject/hapi:v7.4.0
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.bulk_export_enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/fhir/metadata > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
