[project]
name = "mini-care-agent"
version = "0.1.0"
description = "Synthetic-EHR healthcare agent platform: harness, safety gates, LLM routing, OCR structuring, LLM-as-a-Judge eval"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
    "pyyaml>=6.0.3",
]

[project.scripts]
care-agent = "care_agent.cli:main"
care-agent-mcp = "care_agent.mcp_server:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# Korean text is double-width; line length is enforced by the formatter instead.
ignore = ["E501"]
